<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .todo-wrapper {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .todo-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            color: #666;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #efefef;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .todo-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
            transition: all 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: #f0f0f0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            color: #333;
            font-size: 1rem;
            word-break: break-word;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-count {
            color: #666;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .clear-btn {
            padding: 8px 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #f57c00;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .todo-wrapper {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .stats {
                flex-direction: column;
                text-align: center;
            }

            .clear-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <h1>My To-Do List</h1>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            <div class="stats">
                <span id="taskCount" class="task-count">0 tasks</span>
                <button id="clearBtn" class="clear-btn">Clear Completed</button>
            </div>
        </div>
    </div>

    <script>
        class TodoManager {
            constructor() {
                this.storageKey = 'todoList';
                this.todos = this.loadFromStorage();
                this.currentFilter = 'all';
            }

            loadFromStorage() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            saveToStorage() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.todos));
                } catch (e) {
                    console.error('Error saving to storage:', e);
                }
            }

            addTodo(text) {
                if (!text.trim()) return false;
                
                const todo = {
                    id: Date.now(),
                    text: text.trim(),
                    completed: false,
                    createdAt: new Date().toLocaleString()
                };
                
                this.todos.unshift(todo);
                this.saveToStorage();
                return todo;
            }

            deleteTodo(id) {
                this.todos = this.todos.filter(todo => todo.id !== id);
                this.saveToStorage();
            }

            toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveToStorage();
                }
            }

            getFilteredTodos() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.todos.filter(todo => !todo.completed);
                    case 'completed':
                        return this.todos.filter(todo => todo.completed);
                    default:
                        return this.todos;
                }
            }

            clearCompleted() {
                this.todos = this.todos.filter(todo => !todo.completed);
                this.saveToStorage();
            }

            getActiveTodoCount() {
                return this.todos.filter(todo => !todo.completed).length;
            }
        }

        class TodoUI {
            constructor() {
                this.manager = new TodoManager();
                this.todoInput = document.getElementById('todoInput');
                this.addBtn = document.getElementById('addBtn');
                this.todoList = document.getElementById('todoList');
                this.clearBtn = document.getElementById('clearBtn');
                this.taskCount = document.getElementById('taskCount');
                this.filterBtns = document.querySelectorAll('.filter-btn');

                this.init();
            }

            init() {
                this.addEventListeners();
                this.render();
            }

            addEventListeners() {
                this.addBtn.addEventListener('click', () => this.handleAddTodo());
                this.todoInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleAddTodo();
                });

                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => this.handleFilter(e.target.dataset.filter));
                });

                this.clearBtn.addEventListener('click', () => this.handleClearCompleted());
            }

            handleAddTodo() {
                const text = this.todoInput.value;
                if (this.manager.addTodo(text)) {
                    this.todoInput.value = '';
                    this.todoInput.focus();
                    this.render();
                } else {
                    alert('Please enter a task!');
                }
            }

            handleFilter(filter) {
                this.manager.currentFilter = filter;
                
                this.filterBtns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === filter) {
                        btn.classList.add('active');
                    }
                });

                this.render();
            }

            handleClearCompleted() {
                if (this.manager.todos.some(todo => todo.completed)) {
                    if (confirm('Are you sure you want to clear all completed tasks?')) {
                        this.manager.clearCompleted();
                        this.render();
                    }
                } else {
                    alert('No completed tasks to clear!');
                }
            }

            handleDeleteTodo(id) {
                if (confirm('Are you sure you want to delete this task?')) {
                    this.manager.deleteTodo(id);
                    this.render();
                }
            }

            handleToggleTodo(id) {
                this.manager.toggleTodo(id);
                this.render();
            }

            render() {
                this.renderTodoList();
                this.updateStats();
            }

            renderTodoList() {
                const filteredTodos = this.manager.getFilteredTodos();
                this.todoList.innerHTML = '';

                if (filteredTodos.length === 0) {
                    this.todoList.innerHTML = '<div class="empty-message">No tasks to show 📝</div>';
                    return;
                }

                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <input 
                            type="checkbox" 
                            class="checkbox" 
                            ${todo.completed ? 'checked' : ''}
                            onchange="window.todoUI.handleToggleTodo(${todo.id})"
                        >
                        <span class="todo-text">${this.escapeHtml(todo.text)}</span>
                        <button class="delete-btn" onclick="window.todoUI.handleDeleteTodo(${todo.id})">Delete</button>
                    `;
                    this.todoList.appendChild(li);
                });
            }

            updateStats() {
                const activeCount = this.manager.getActiveTodoCount();
                
                this.taskCount.textContent = activeCount === 1 
                    ? '1 task remaining' 
                    : `${activeCount} tasks remaining`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        window.todoUI = null;
        document.addEventListener('DOMContentLoaded', () => {
            window.todoUI = new TodoUI();
        });
    </script>
</body>
</html>
